    <link rel="alternate" hreflang="de" href="https://kodinitools.com/equaliser19/" />

    <link rel="alternate" hreflang="x-default" href="https://kodinitools.com/equaliser19/" />

    <meta
      property="og:title"
      content="Equalizer online – 19-Band-EQ mit Kompressor | KodiniTools"
    />
    <meta
      property="og:description"

    <meta name="theme-color" content="#f6f2e8" media="(prefers-color-scheme: light)" />

    <!-- Webfonts (served site-wide from /fonts/) start loading before the CSS
         bundle is parsed, which shortens the font swap and the shift it causes. -->
    <link
      rel="preload"
      href="/fonts/Supreme-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/Supreme-Bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Critical layout before the app mounts: the SSI footer must not sit
         directly under the navigation and then jump down when Vue renders
         (CLS). The empty #app already reserves a full viewport of height. -->
    <style>
      #app {
        min-height: 100vh;
        min-height: 100dvh;
      }
    </style>
  </head>
  <body>
    <!--#include virtual="/partials/nav.html" -->
    <div id="app"></div>
    <!--#include virtual="/partials/footer.html" -->
